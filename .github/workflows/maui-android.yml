name: FioLab MAUI Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "FioLab.Engine/**"
      - "FioLab.Engine.Smoke/**"
      - "FioLab.Maui/**"
      - ".github/workflows/maui-android.yml"

permissions:
  contents: read

concurrency:
  group: fiolab-maui-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android API 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install MAUI Android workload
        shell: bash
        run: dotnet workload install maui-android

      - name: Restore engine
        run: dotnet restore FioLab.Engine.Smoke/FioLab.Engine.Smoke.csproj

      - name: Motor contract smoke test
        run: dotnet run --project FioLab.Engine.Smoke/FioLab.Engine.Smoke.csproj -c Release

      - name: Restore MAUI app
        run: dotnet restore FioLab.Maui/FioLab.Maui.csproj

      - name: Build installable APK
        shell: bash
        run: |
          dotnet build FioLab.Maui/FioLab.Maui.csproj \
            -f net10.0-android \
            -c Debug \
            -p:AndroidPackageFormats=apk

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find FioLab.Maui/bin/Debug -type f -name '*Signed.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            APK="$(find FioLab.Maui/bin/Debug -type f -name '*.apk' | head -n 1)"
          fi
          test -n "$APK"
          cp "$APK" out/FioLab-MAUI-0.70.0-debug.apk
          sha256sum out/FioLab-MAUI-0.70.0-debug.apk > out/FioLab-MAUI-0.70.0-SHA256.txt

      - name: Upload MAUI APK
        uses: actions/upload-artifact@v4
        with:
          name: FioLab-MAUI-0.70.0
          path: out/*
