name: FioLab MAUI Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "FioLab.Engine/**"
      - "FioLab.Engine.Smoke/**"
      - "FioLab.Maui/**"
      - ".github/workflows/maui-android.yml"

permissions:
  contents: read

concurrency:
  group: fiolab-maui-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android API 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install MAUI Android workload
        shell: bash
        run: dotnet workload install maui-android

      - name: Restore engine
        run: dotnet restore FioLab.Engine.Smoke/FioLab.Engine.Smoke.csproj

      - name: Motor contract smoke test
        run: dotnet run --project FioLab.Engine.Smoke/FioLab.Engine.Smoke.csproj -c Release

      - name: Restore MAUI app
        run: dotnet restore FioLab.Maui/FioLab.Maui.csproj

      - name: Build installable APK
        shell: bash
        run: |
          dotnet build FioLab.Maui/FioLab.Maui.csproj \
            -f net10.0-android \
            -c Debug \
            -p:AndroidPackageFormats=apk

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK="$(find FioLab.Maui/bin/Debug -type f -name '*Signed.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            APK="$(find FioLab.Maui/bin/Debug -type f -name '*.apk' | head -n 1)"
          fi
          test -n "$APK"
          cp "$APK" out/FioLab-MAUI-0.70.0-debug.apk
          sha256sum out/FioLab-MAUI-0.70.0-debug.apk > out/FioLab-MAUI-0.70.0-SHA256.txt

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android startup smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash -lc 'set -e; adb install -r out/FioLab-MAUI-0.70.0-debug.apk; adb logcat -c; adb shell monkey -p com.timachado.fiolab.maui -c android.intent.category.LAUNCHER 1; sleep 8; PID="$(adb shell pidof com.timachado.fiolab.maui | tr -d "\r")"; if [ -z "$PID" ]; then echo "FioLab MAUI morreu durante a inicializacao."; adb logcat -d | tail -n 500; exit 1; fi; echo "FioLab MAUI permaneceu aberto. PID=$PID"'

      - name: Upload MAUI APK
        uses: actions/upload-artifact@v4
        with:
          name: FioLab-MAUI-0.70.0
          path: out/*
