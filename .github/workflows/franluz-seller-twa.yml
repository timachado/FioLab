name: Build FranLuz Seller TWA 2.1.3

on:
  push:
    branches:
      - temp/franluz-seller-twa-2.1.0
    paths:
      - 'franluz-seller-twa/**'
      - '.github/workflows/franluz-seller-twa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build Seller TWA APK
        working-directory: franluz-seller-twa
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify and package
        shell: bash
        run: |
          test -s franluz-seller-twa/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp franluz-seller-twa/app/build/outputs/apk/debug/app-debug.apk dist/FranLuz-Seller-TWA-v2.1.3.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/FranLuz-Seller-TWA-v2.1.3.apk
          sha256sum dist/FranLuz-Seller-TWA-v2.1.3.apk | tee dist/FranLuz-Seller-TWA-v2.1.3.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: FranLuz-Seller-TWA-v2.1.3
          path: |
            dist/FranLuz-Seller-TWA-v2.1.3.apk
            dist/FranLuz-Seller-TWA-v2.1.3.sha256
          if-no-files-found: error
          retention-days: 7

  smoke-android-15:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build test APK
        working-directory: franluz-seller-twa
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 launcher smoke
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c
            adb install -r franluz-seller-twa/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.franluz.seller/com.google.androidbrowserhelper.trusted.LauncherActivity | tee twa-start.txt
            sleep 8
            adb logcat -d -v brief | grep -E "AndroidRuntime|FATAL EXCEPTION|com.franluz.seller|LauncherActivity" | tail -n 250 | tee twa-log.txt || true
            grep -q "Status: ok" twa-start.txt
            ! grep -q "FATAL EXCEPTION" twa-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FranLuz-Seller-TWA-v2.1.3-smoke
          path: |
            twa-start.txt
            twa-log.txt
          if-no-files-found: ignore
          retention-days: 7
