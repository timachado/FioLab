name: Temp Smoke FranLuz Seller v1.1

on:
  push:
    branches:
      - temp/franluz-seller-apk-build
    paths:
      - 'franluz-seller-android/**'
      - '.github/workflows/franluz-seller-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Build APK
        working-directory: franluz-seller-android
        run: gradle --no-daemon :sellerapp:assembleDebug --stacktrace

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch smoke test on Android 15
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c
            adb install -r franluz-seller-android/sellerapp/build/outputs/apk/debug/sellerapp-debug.apk
            adb shell am force-stop com.franluz.seller
            adb shell am start -W -n com.franluz.seller/.MainActivity
            sleep 8
            echo "PID=$(adb shell pidof com.franluz.seller || true)"
            adb shell dumpsys activity activities | grep -A3 -B3 com.franluz.seller || true
            adb logcat -d -v brief | grep -E "AndroidRuntime|FATAL EXCEPTION|com.franluz.seller|chromium" | tail -n 250 | tee franluz-launch-log.txt
            test -n "$(adb shell pidof com.franluz.seller)"

      - name: Upload launch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FranLuz-Seller-v1.1.0-launch-log
          path: franluz-launch-log.txt
          if-no-files-found: ignore
          retention-days: 7
