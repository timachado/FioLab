name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using: $SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare brand assets
        shell: bash
        run: |
          bash scripts/prepare_brand_assets.sh
          file app/src/main/res/drawable-nodpi/fiolab_brand_logo.jpg
          file app/src/main/res/mipmap-xxxhdpi/ic_launcher_fiolab.jpg


      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare downloadable files
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FioLab-0.21.8-debug.apk
          zip -9 FioLab-0.21.8-debug.zip FioLab-0.21.8-debug.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FioLab-0.21.8-downloads
          path: |
            FioLab-0.21.8-debug.apk
            FioLab-0.21.8-debug.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.21.8 >/dev/null 2>&1; then
            gh release upload v0.21.8               FioLab-0.21.8-debug.apk               FioLab-0.21.8-debug.zip               --clobber
          else
            gh release create v0.21.8               FioLab-0.21.8-debug.apk               FioLab-0.21.8-debug.zip               --target main               --title "FioLab 0.21.8"               --notes "FioLab 0.21.8: corrige a conversão TTF/OTF para bordado preenchendo a área real dos glifos, ajusta a escala pela altura visual da fonte e mantém o zoom automático do Simulador."
          fi
