name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract FioLab source
        run: |
          mkdir appsrc
          unzip source/FioLab-0.2.0-source.zip -d appsrc

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        working-directory: appsrc
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: appsrc
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp appsrc/app/build/outputs/apk/debug/app-debug.apk FioLab-0.2.0-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FioLab-0.2.0-APK
          path: FioLab-0.2.0-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release upload v0.2.0 FioLab-0.2.0-debug.apk --clobber
          else
            gh release create v0.2.0 FioLab-0.2.0-debug.apk               --target main               --title "FioLab 0.2.0"               --notes "APK de desenvolvimento do FioLab 0.2.0. Inclui leitor/visualizador DST e simulador progressivo. Build debug para testes em Android 8.0+."
          fi