name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using: $SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare downloadable files
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FioLab-0.21.2-debug.apk
          zip -9 FioLab-0.21.2-debug.zip FioLab-0.21.2-debug.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FioLab-0.21.2-downloads
          path: |
            FioLab-0.21.2-debug.apk
            FioLab-0.21.2-debug.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.21.2 >/dev/null 2>&1; then
            gh release upload v0.21.2               FioLab-0.21.2-debug.apk               FioLab-0.21.2-debug.zip               --clobber
          else
            gh release create v0.21.2               FioLab-0.21.2-debug.apk               FioLab-0.21.2-debug.zip               --target main               --title "FioLab 0.21.2"               --notes "FioLab 0.21.2: correção de crash de inicialização com Minha Conta isolada, Ktor alinhado ao Supabase 3.2.x e launcher usando mipmap da identidade FioLab Matrizes."
          fi
