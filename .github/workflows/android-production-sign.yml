name: Build Signed Production APK

on:
  workflow_dispatch:
  push:
    branches: ["fix/brother-directopen-safe4-0469"]

permissions:
  contents: read

jobs:
  signed-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare brand assets
        shell: bash
        run: bash scripts/prepare_brand_assets.sh

      - name: Repository safety checks
        run: bash scripts/pre_release_static_check.sh

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Validate production signing secrets
        shell: bash
        env:
          FIOLAB_RELEASE_KEYSTORE_BASE64: ${{ secrets.FIOLAB_RELEASE_KEYSTORE_BASE64 }}
          FIOLAB_RELEASE_STORE_PASSWORD: ${{ secrets.FIOLAB_RELEASE_STORE_PASSWORD }}
          FIOLAB_RELEASE_KEY_ALIAS: ${{ secrets.FIOLAB_RELEASE_KEY_ALIAS }}
          FIOLAB_RELEASE_KEY_PASSWORD: ${{ secrets.FIOLAB_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$FIOLAB_RELEASE_KEYSTORE_BASE64" || { echo "Missing FIOLAB_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$FIOLAB_RELEASE_STORE_PASSWORD" || { echo "Missing FIOLAB_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$FIOLAB_RELEASE_KEY_ALIAS" || { echo "Missing FIOLAB_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$FIOLAB_RELEASE_KEY_PASSWORD" || { echo "Missing FIOLAB_RELEASE_KEY_PASSWORD"; exit 1; }

      - name: Decode temporary production keystore
        shell: bash
        env:
          FIOLAB_RELEASE_KEYSTORE_BASE64: ${{ secrets.FIOLAB_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$FIOLAB_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fiolab-production.jks"
          chmod 600 "$RUNNER_TEMP/fiolab-production.jks"

      - name: Build unsigned release
        run: gradle :app:assembleRelease --stacktrace

      - name: Align and sign production APK
        shell: bash
        env:
          FIOLAB_RELEASE_STORE_PASSWORD: ${{ secrets.FIOLAB_RELEASE_STORE_PASSWORD }}
          FIOLAB_RELEASE_KEY_ALIAS: ${{ secrets.FIOLAB_RELEASE_KEY_ALIAS }}
          FIOLAB_RELEASE_KEY_PASSWORD: ${{ secrets.FIOLAB_RELEASE_KEY_PASSWORD }}
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/FioLab-$VERSION_NAME-aligned.apk"
          SIGNED="FioLab-$VERSION_NAME-production.apk"

          test -f "$UNSIGNED"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/fiolab-production.jks" \
            --ks-key-alias "$FIOLAB_RELEASE_KEY_ALIAS" \
            --ks-pass "env:FIOLAB_RELEASE_STORE_PASSWORD" \
            --key-pass "env:FIOLAB_RELEASE_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"

          "$BUILD_TOOLS/apksigner" verify --print-certs "$SIGNED" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            > "FioLab-$VERSION_NAME-CERT-SHA256.txt"

          test -s "FioLab-$VERSION_NAME-CERT-SHA256.txt"

          sha256sum "$SIGNED" > "FioLab-$VERSION_NAME-APK-SHA256.txt"

          {
            echo "VERSION_NAME=$VERSION_NAME"
            echo "SIGNED_APK=$SIGNED"
            echo "CERT_FILE=FioLab-$VERSION_NAME-CERT-SHA256.txt"
            echo "APK_SHA_FILE=FioLab-$VERSION_NAME-APK-SHA256.txt"
          } >> "$GITHUB_ENV"

      - name: Upload signed production candidate
        uses: actions/upload-artifact@v4
        with:
          name: FioLab-${{ env.VERSION_NAME }}-signed-production-candidate
          path: |
            ${{ env.SIGNED_APK }}
            ${{ env.CERT_FILE }}
            ${{ env.APK_SHA_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/fiolab-production.jks"
          rm -f "$RUNNER_TEMP"/FioLab-*-aligned.apk
