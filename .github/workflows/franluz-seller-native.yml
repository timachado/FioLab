name: Build FranLuz Seller Native 2.0\n# validation trigger after AGP 9 Kotlin cleanup

on:
  push:
    branches:
      - temp/franluz-seller-native-v2-build
    paths:
      - 'franluz-seller-native/**'
      - 'franluz-seller-bridge/**'
      - '.github/workflows/franluz-seller-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: php -l franluz-seller-bridge/franluz-seller-bridge.php
      - name: Package WordPress plugin
        run: |
          mkdir -p dist/franluz-seller-bridge
          cp franluz-seller-bridge/franluz-seller-bridge.php dist/franluz-seller-bridge/
          cp franluz-seller-bridge/README.md dist/franluz-seller-bridge/
          cd dist
          zip -r FranLuz-Seller-Bridge-v2.0.0.zip franluz-seller-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: FranLuz-Seller-Bridge-v2.0.0
          path: dist/FranLuz-Seller-Bridge-v2.0.0.zip
          if-no-files-found: error
          retention-days: 7

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build native APK
        working-directory: franluz-seller-native
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp franluz-seller-native/app/build/outputs/apk/debug/app-debug.apk dist/FranLuz-Seller-Native-v2.0.0.apk
          sha256sum dist/FranLuz-Seller-Native-v2.0.0.apk | tee dist/FranLuz-Seller-Native-v2.0.0.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FranLuz-Seller-Native-v2.0.0
          path: |
            dist/FranLuz-Seller-Native-v2.0.0.apk
            dist/FranLuz-Seller-Native-v2.0.0.sha256
          if-no-files-found: error
          retention-days: 7

  smoke-android-15:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK for smoke test
        working-directory: franluz-seller-native
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 cold-start smoke
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c
            adb install -r franluz-seller-native/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.franluz.seller
            adb shell am start -W -n com.franluz.seller/.MainActivity
            sleep 8
            echo "PID=$(adb shell pidof com.franluz.seller || true)"
            adb logcat -d -v brief | grep -E "AndroidRuntime|FATAL EXCEPTION|com.franluz.seller" | tail -n 250 | tee native-v2-launch.log
            test -n "$(adb shell pidof com.franluz.seller)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FranLuz-Seller-Native-v2.0.0-smoke-log
          path: native-v2-launch.log
          if-no-files-found: ignore
          retention-days: 7
