name: FioLab V2 Android

on:
  workflow_dispatch:
  push:
    branches:
      - rewrite-v2
    paths:
      - "FioLab2.Engine/**"
      - "FioLab2.Smoke/**"
      - "FioLab2.Maui/**"
      - ".github/workflows/fiolab2-android.yml"

permissions:
  contents: read

concurrency:
  group: fiolab-v2-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android API 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore V2 engine
        run: dotnet restore FioLab2.Smoke/FioLab2.Smoke.csproj

      - name: V2 motor geometry smoke test
        run: dotnet run --project FioLab2.Smoke/FioLab2.Smoke.csproj -c Release

      - name: Restore V2 MAUI app
        run: dotnet restore FioLab2.Maui/FioLab2.Maui.csproj

      - name: Build V2 installable APK
        run: dotnet build FioLab2.Maui/FioLab2.Maui.csproj -f net10.0-android -c Debug -p:AndroidPackageFormats=apk -p:EmbedAssembliesIntoApk=true

      - name: Collect V2 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out-v2
          APK="$(find FioLab2.Maui/bin/Debug -type f -name '*Signed.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            APK="$(find FioLab2.Maui/bin/Debug -type f -name '*.apk' | head -n 1)"
          fi
          test -n "$APK"
          cp "$APK" out-v2/FioLab-V2-2.0.0-alpha.2-debug.apk
          sha256sum out-v2/FioLab-V2-2.0.0-alpha.2-debug.apk > out-v2/FioLab-V2-2.0.0-alpha.2-SHA256.txt

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: V2 Android startup smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash -lc 'set -e; adb install -r out-v2/FioLab-V2-2.0.0-alpha.2-debug.apk; adb logcat -c; adb shell monkey -p com.timachado.fiolab.v2 -c android.intent.category.LAUNCHER 1; sleep 8; PID="$(adb shell pidof com.timachado.fiolab.v2 | xargs)"; if [ -z "$PID" ]; then echo "FioLab V2 morreu durante a inicializacao."; adb logcat -b crash -d || true; adb logcat -d -v threadtime | grep -E "com\\.timachado\\.fiolab\\.v2|AndroidRuntime|FATAL EXCEPTION|dotnet|mono|SkiaSharp|libc" || true; exit 1; fi; echo "FioLab V2 permaneceu aberto. PID=$PID"'

      - name: Upload V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: FioLab-V2-2.0.0-alpha.2
          path: out-v2/*
